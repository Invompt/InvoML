name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.22.0]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm install --global npm@11.11.0
      - run: npm run check:lock
      - run: npm ci
      - run: npm run check:privacy
      - run: npm run build
      - run: npm test

  package-consumer:
    name: Node 18 package consumer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm install --global npm@11.11.0
      - run: npm run check:lock
      - run: npm ci
      - name: Pack a clean artifact and verify its contents
        id: package
        run: |
          node -e "require('node:fs').mkdirSync('dist/src', { recursive: true }); require('node:fs').writeFileSync('dist/src/pdf.js', 'stale artifact')"
          npm pack --json > package-pack.json
          node scripts/assert-privacy.mjs --pack-report package-pack.json
          node scripts/assert-package.mjs package-pack.json
          node -e "const report = require('./package-pack.json')[0]; require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT, 'tarball=' + report.filename + '\n')"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 18
      - name: Exercise the packed package as a Node 18 consumer
        run: node scripts/smoke-node18-consumer.mjs "${{ steps.package.outputs.tarball }}"

  git-sha-consumer:
    name: Exact Git SHA consumer
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out the exact remote source SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_SHA }}
          path: source
          fetch-depth: 1
          persist-credentials: false
      - name: Verify the checked out SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: source/package-lock.json
      - run: npm install --global npm@11.11.0
      - run: npm --prefix source run check:lock
      - run: npm --prefix source ci
      - run: npm --prefix source run check:privacy
      - name: Pack the exact-SHA source
        id: package
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          PACKAGE_DIR="$RUNNER_TEMP/invoml-git-sha-package"
          mkdir -p "$PACKAGE_DIR"
          npm pack --json --pack-destination "$PACKAGE_DIR" > "$PACKAGE_DIR/package-pack.json"
          node scripts/assert-package.mjs "$PACKAGE_DIR/package-pack.json"
          TARBALL=$(node -p "require(process.argv[1])[0].filename" "$PACKAGE_DIR/package-pack.json")
          echo "tarball=$PACKAGE_DIR/$TARBALL" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 18
      - name: Exercise the exact-SHA package as a Node 18 consumer
        run: node source/scripts/smoke-node18-consumer.mjs "${{ steps.package.outputs.tarball }}"
